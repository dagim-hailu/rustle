syntax = "proto3";

// Internal contract between the HTTP API and the Rust read shield. The API
// converts decimal Snowflake ids (safe for JavaScript) to fixed-width
// big-endian bytes at this boundary. The shield owns the CQL queries.
package shield.v1;

service ReadShield {
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message GetHistoryRequest {
  // 16-byte UUID of the channel.
  bytes channel_id = 1;
  // 8-byte big-endian Snowflake cursor. Empty means "from the newest message".
  bytes before_message_id = 2;
  uint32 limit = 3;
}

message StoredMessage {
  bytes message_id = 1;
  bytes channel_id = 2;
  bytes author_id = 3;
  string content = 4;
  repeated string attachments = 5;
  int64 timestamp_ms = 6;
}

message GetHistoryResponse {
  // Newest first. The API reverses this for the UI's oldest-first list.
  repeated StoredMessage messages = 1;
  bytes next_cursor = 2;
  bool has_more = 3;
}
